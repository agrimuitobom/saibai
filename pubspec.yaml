name: green_thumb
description: 家庭菜園管理アプリ - ベジグロ

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1

  # ナビゲーション
  go_router: ^13.2.0

  # ネットワーク
  http: ^1.1.0

  # ローカルDB
  shared_preferences: ^2.2.3

  # 画像関連
  image_picker: ^1.1.2

  # ユーティリティ
  intl: ^0.19.0
  uuid: ^4.4.0

  # カレンダー
  table_calendar: ^3.0.9

  # UI
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/crops/
    - assets/icons/
